name: Car auction -> Notion

on:
  schedule:
    - cron: "*/5 * * * *"    # кожні 5 хвилин (час UTC)
  workflow_dispatch: {}       # кнопка «Run workflow» для ручного запуску

permissions:
  contents: read
  actions: write              # щоб тримати розклад увімкненим (keepalive)

concurrency:
  group: car-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync purchases to Notion
        env:
          AUCTION_API_KEY: ${{ secrets.AUCTION_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SINCE: ${{ vars.SINCE }}
        run: python car_sync.py
      # GitHub вимикає розклад у публічних репозиторіях після 60 днів без змін.
      # Раз на день повторно вмикаємо workflow, щоб він не зупинився.
      - name: Keepalive
        if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H%M)" \< "0005" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/car-sync.yml/enable"
          fi
